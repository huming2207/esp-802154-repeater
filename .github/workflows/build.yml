name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a release with this new tag (e.g. v1.0.0). Leave empty for a plain build."
        required: false
        default: ""

jobs:
  build:
    name: Build ${{ matrix.protocol }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        protocol: [zigbee, thread]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the version string

      - name: Build
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$RELEASE_TAG" ]; then
            # Manual release: tag locally so the firmware version (git describe) is the tag.
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_tag must look like v1.2.3"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "Tag $RELEASE_TAG already exists"; exit 1
            fi
            git tag "$RELEASE_TAG"
          fi
          . "$IDF_PATH/export.sh"
          scripts/build.sh ${{ matrix.protocol }}

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.protocol }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    name: Publish release
    # A pushed v* tag, or a manual run with release_tag (the tag is then created by the release).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum ./*.bin > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
